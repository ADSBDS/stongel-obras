<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stongel · Formulários de Obras</title>
<meta name="theme-color" content="#1C2C4C">
<meta name="description" content="Formulários de Obras Stongel: obras, formulários OB-01 a OB-22 e passagem de bastão.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stongel Obras">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1C2C4C;--deep:#14203A;--blue:#36A8E0;--mid:#2B6CB0;--light:#EEF2F6;--line:#D5DDE7;--ink:#1A1F2B;--gray:#5B6577;--ok:#1E7B3C;--okbg:#DDF3E3;--bad:#B42318;--badbg:#FDE4E1;--warn:#9A6700;--warnbg:#FFF1CC;--input:#F4F9FE}
*{box-sizing:border-box}
html,body{margin:0;background:#F6F8FB;color:var(--ink);font-family:'Open Sans',Arial,sans-serif;font-size:15px}
h1,h2,h3,.brand{font-family:Montserrat,Arial,sans-serif}
button{font:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hbar{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1100px;margin:0 auto}
.hbar img{height:34px}
.hbar .apptitle{font-family:Montserrat,Arial,sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--blue);text-transform:uppercase;border-left:1px solid rgba(255,255,255,.25);padding-left:14px}
.hbar .sp{flex:1}
.who{font-size:12px;color:#C9D3DF}
nav{display:flex;gap:4px;max-width:1100px;margin:0 auto;padding:0 12px;overflow-x:auto}
nav button{background:none;border:0;color:#C9D3DF;padding:10px 12px;font-family:Montserrat,Arial,sans-serif;font-weight:600;font-size:13px;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:var(--blue)}
nav .badge{background:var(--blue);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px}
main{max-width:1100px;margin:0 auto;padding:18px 16px 110px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:10px 16px;font-family:Montserrat,Arial,sans-serif;font-weight:700;font-size:13px;background:var(--light);color:var(--navy)}
.btn.pri{background:var(--mid);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.obra h3{margin:0 0 4px;font-size:16px;color:var(--navy)}
.muted{color:var(--gray);font-size:13px}
.prog{height:6px;background:var(--light);border-radius:4px;margin:12px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue)}
.pagehead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pagehead h2{margin:0;color:var(--navy);font-size:22px}
.pagehead .code{font-family:Montserrat,Arial,sans-serif;font-weight:800;color:var(--mid);font-size:13px;letter-spacing:.05em}
.back{background:none;border:0;color:var(--mid);font-weight:700;padding:0;margin-bottom:8px;font-family:Montserrat,Arial,sans-serif;font-size:13px}
.stage{margin-bottom:14px}
.stage h4{margin:0;padding:10px 14px;background:var(--navy);color:#fff;border-radius:10px 10px 0 0;font-family:Montserrat,Arial,sans-serif;font-size:13px;display:flex;gap:10px;align-items:center}
.stage h4 span.n{background:var(--blue);border-radius:6px;padding:2px 8px}
.stage .list{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px}
.fi{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--light);cursor:pointer}
.fi:first-child{border-top:0}
.fi:hover{background:#FAFCFE}
.fi .c{font-family:Montserrat,Arial,sans-serif;font-weight:800;color:var(--mid);font-size:12px;width:52px}
.fi .t{flex:1}
.fi .t small{display:block;color:var(--gray);font-size:12px}
.chip{font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap;font-family:Montserrat,Arial,sans-serif}
.chip.none{background:var(--light);color:var(--gray)}
.chip.draft{background:var(--warnbg);color:var(--warn)}
.chip.done{background:#E1EEFB;color:var(--mid)}
.chip.sent{background:var(--okbg);color:var(--ok)}
.sec{background:var(--mid);color:#fff;font-family:Montserrat,Arial,sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:8px 12px;border-radius:8px;margin:18px 0 10px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px 14px}
.f label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:4px}
.f.wide{grid-column:1/-1}
input,select,textarea{width:100%;font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);border-color:var(--blue);background:#fff}
textarea{min-height:70px;resize:vertical}
.calc{padding:9px 10px;border-radius:8px;background:var(--light);font-weight:700;min-height:38px}
.calc.big{font-size:18px;text-align:center;font-family:Montserrat,Arial,sans-serif}
.good{background:var(--okbg)!important;color:var(--ok)!important}
.badv{background:var(--badbg)!important;color:var(--bad)!important}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:560px}
th{background:var(--light);color:var(--navy);font-size:11.5px;text-align:left;padding:8px;font-family:Montserrat,Arial,sans-serif;font-weight:700;white-space:nowrap}
td{border-top:1px solid var(--light);padding:4px 6px;font-size:13px;vertical-align:middle}
td input,td select{padding:6px 7px;font-size:13px;min-width:80px}
td.ro{font-weight:600;color:var(--navy);min-width:150px}
td.cc{background:#FAFBFC;font-weight:700;white-space:nowrap}
tr.tot td{background:var(--light);font-weight:800}
.check .it{display:grid;grid-template-columns:1fr 160px 1fr;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--light)}
.check .it:first-child{border-top:0}
.note{font-size:12.5px;color:var(--gray);font-style:italic;margin:8px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.06);z-index:15}
.bar .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .st{flex:1;font-size:12px;color:var(--gray)}
.modal{position:fixed;inset:0;background:rgba(20,32,58,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow-y:auto}
.modal .box{background:#fff;border-radius:14px;max-width:640px;width:100%;padding:20px}
.modal h3{margin:0 0 4px;color:var(--navy)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:90vw}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--light);border-radius:20px;padding:4px 10px;font-size:12px;margin:2px}
.hand{border-left:4px solid var(--blue)}
.empty{text-align:center;padding:40px 10px;color:var(--gray)}
.empty img{height:60px;opacity:.35;margin-bottom:10px}
.info{background:#E8F3FC;border:1px solid #C3DEF5;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--navy);margin-bottom:14px}
.warnbox{background:var(--warnbg);border:1px solid #F1D48A;border-radius:10px;padding:12px 14px;font-size:13px;color:#6B4B00;margin-bottom:14px}
pre.code{background:var(--deep);color:#DCE6F2;padding:12px;border-radius:8px;font-size:11.5px;overflow:auto;max-height:260px}
.tabs2{display:flex;gap:6px;margin-bottom:12px}
@media (max-width:640px){.check .it{grid-template-columns:1fr}.hbar .apptitle{display:none}main{padding:14px 10px 120px}}
@media print{header,.bar,.back,.noprint{display:none!important}main{padding:0}body{background:#fff}.sec{-webkit-print-color-adjust:exact;print-color-adjust:exact}.printhead{display:flex!important}}
.printhead{display:none;background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;align-items:center;gap:14px;margin-bottom:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.printhead img{height:30px}
.sync{font-size:11px;padding:3px 9px;border-radius:12px;background:rgba(255,255,255,.12);color:#C9D3DF;white-space:nowrap}
.sync:empty{display:none}
.sync.warn{background:var(--warnbg);color:#6B4B00}
.login{max-width:400px;margin:40px auto;text-align:center}
.login .f{text-align:left}
.login .lsym{height:56px;margin-bottom:6px}
.login h2{color:var(--navy);margin:0 0 6px}
.login form{margin-top:14px}
.codein{font-size:24px!important;letter-spacing:8px;text-align:center}
[hidden]{display:none!important}
</style>
</head>

function num(v) { if (v === null || v === undefined || v === '') return null; if (typeof v === 'number') return isFinite(v) ? v : null; let s = String(v).trim().replace(/\s|R\$|%/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? n : null; }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = String(iso).slice(0, 10).split('-'); return d ? `${d}/${m}/${y}` : iso; }
function addWork(iso, n) { const d = new Date(iso + 'T12:00'); let k = 0; while (k < n) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 0 && w !== 6) k++; } return d.toISOString().slice(0, 10); }
function fmtVal(v, f) { if (v === '' || v === null || v === undefined) return ''; if (typeof v !== 'number') return String(v); if (f === 'brl') return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); if (f === 'pct') return (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%'; if (f === 'n3') return v.toLocaleString('pt-BR', { maximumFractionDigits: 3 }); if (f === 'n1') return v.toLocaleString('pt-BR', { maximumFractionDigits: 1 }); return v.toLocaleString('pt-BR', { maximumFractionDigits: 2 }); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowISO = () => new Date().toISOString();
function fmtDT(iso) { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
function toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
const splitMails = s => String(s || '').split(/[,;\s]+/).map(x => x.trim()).filter(x => /.+@.+\..+/.test(x));

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { } }

// ===== conexão com o servidor (hoje: Planilha Google via Apps Script) =====
// Ponto único de troca: na migração para o servidor interno, só o objeto API muda.
const CFG = window.STONGEL_CONFIG || {};
const apiUrl = () => String(SET.scriptUrl || CFG.scriptUrl || '').trim();
const ONLINE = () => !!apiUrl();
const API = {
  async call(action, body = {}, auth = true) {
    const payload = Object.assign({ action }, auth ? { session: SET.session } : {}, body);
    const r = await fetch(apiUrl(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    const j = await r.json();
    if (auth && j && j.error === 'auth') { onAuthLost(); const e = new Error('auth'); e.code = 'auth'; throw e; }
    return j;
  },
  login: (email, codigo) => API.call('login', { email, codigo }, false),
  list: since => API.call('list', { since }),
  bulk: ops => API.call('bulk', { ops }),
  send: msg => API.call('send', msg),
  logout: () => API.call('logout'),
};

let OUTBOX = lsGet(LSO) || [];
const SYNC = { state: 'idle', at: null };
function setSync(state) { SYNC.state = state; if (state === 'ok') SYNC.at = new Date(); paintSync(); }
function paintSync() {
  const el = document.getElementById('sync'); if (!el) return;
  if (!ONLINE() || !SET.session) { el.textContent = ''; return; }
  const n = OUTBOX.length, off = !navigator.onLine || SYNC.state === 'offline';
  const pend = n ? `${n} pendente${n > 1 ? 's' : ''}` : '';
  el.textContent = SYNC.state === 'syncing' ? 'Sincronizando…' : off ? 'Offline' + (n ? ' · ' + pend : '') : SYNC.state === 'error' ? 'Erro ao sincronizar' + (n ? ' · ' + pend : '') : pend || 'Sincronizado';
  el.className = 'sync' + (n || off || SYNC.state === 'error' ? ' warn' : '');
  el.title = SYNC.at ? 'Última sincronização: ' + SYNC.at.toLocaleTimeString('pt-BR') : '';
}

function enqueue(kind, id, val) {
  OUTBOX = OUTBOX.filter(o => !(o.kind === kind && o.id === id));
  OUTBOX.push({ kind, id, val: val === null ? null : JSON.parse(JSON.stringify(val)) });
  lsSet(LSO, OUTBOX);
}

async function persist(kind, id, val) {
  if (val === null) delete DB[kind][id]; else DB[kind][id] = val;
  if (!lsSet(LS, DB)) toast('Não foi possível salvar neste aparelho. Faça um backup.');
  if (!ONLINE()) return;
  enqueue(kind, id, val); paintSync(); flush();
}

let flushing = null;
function flush() {
  if (flushing) return flushing;
  flushing = (async () => {
    await null; // garante que o finally rode depois da atribuição de "flushing"
    try {
      while (OUTBOX.length && SET.session && navigator.onLine) {
        const batch = OUTBOX.slice(0, 25);
        setSync('syncing');
        const r = await API.bulk(batch);
        if (!r || !r.ok) throw new Error(r && r.error);
        OUTBOX = OUTBOX.filter(o => !batch.includes(o)); lsSet(LSO, OUTBOX);
      }
      setSync(navigator.onLine ? 'ok' : 'offline');
    } catch (e) { if (e.code !== 'auth') setSync(navigator.onLine ? 'error' : 'offline'); }
    finally { flushing = null; }
  })();
  return flushing;
}

let pulling = false;
async function pull() {
  if (!ONLINE() || !SET.session || pulling) { paintSync(); return; }
  if (!navigator.onLine) { setSync('offline'); return; }
  pulling = true;
  try {
    await flush();
    setSync('syncing');
    const last = lsGet(LSL) || '';
    const since = last ? new Date(new Date(last).getTime() - 60000).toISOString() : '';
    const r = await API.list(since);
    if (!r || !r.ok) throw new Error(r && r.error);
    const pend = new Set(OUTBOX.map(o => o.kind + '/' + o.id));
    let changed = false, upload = false;
    KINDS.forEach(k => {
      const inc = r.data[k] || {};
      if (r.full) Object.keys(DB[k]).forEach(id => { if (!(id in inc) && !pend.has(k + '/' + id)) { enqueue(k, id, DB[k][id]); upload = true; } });
      Object.entries(inc).forEach(([id, v]) => {
        if (pend.has(k + '/' + id)) return;
        if (v === null) { if (DB[k][id]) { delete DB[k][id]; changed = true; } }
        else if (JSON.stringify(DB[k][id]) !== JSON.stringify(v)) { DB[k][id] = v; changed = true; }
      });
    });
    lsSet(LS, DB); lsSet(LSL, r.now);
    setSync('ok');
    if (changed) softRender();
    if (upload) flush();
  } catch (e) { if (e.code !== 'auth') setSync(navigator.onLine ? 'error' : 'offline'); }
  finally { pulling = false; }
}

let syncTimer = null;
function startSync() { if (!syncTimer) syncTimer = setInterval(() => { if (!document.hidden) pull(); }, 30000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
window.addEventListener('online', () => { paintSync(); flush().then(pull); });
window.addEventListener('offline', paintSync);

async function boot() {

function formsOf(obraId) { return Object.entries(DB.forms).filter(([k, f]) => f.obra === obraId); }
function statusOf(obraId, code) {

  if (!list.length) return 'none';

  <div style="color:#5B6577;font-size:13px;margin-bottom:14px">${esc(o.nome || '')}${o.cliente ? ' · ' + esc(o.cliente) : ''}${o.cidade ? ' · ' + esc(o.cidade) : ''}</div>
  <p style="font-size:14px;line-height:1.5;white-space:pre-wrap">${esc(intro)}</p>
  <table style="border-collapse:collapse;width:100%;margin-top:10px">${body}</table>
  <p style="font-size:12px;color:#5B6577;margin-top:18px">Enviado por ${esc(from.name || '')}${from.email ? ' (' + esc(from.email) + ')' : ''} pelo app de Formulários de Obras Stongel em ${fmtDT(nowISO())}.</p>
  </div><div style="text-align:center;font-size:11px;color:#5B6577;padding:10px">Stongel Pisos e Revestimentos · www.stongel.com.br</div></div>`;
}
function recipientsFor(rec, roles) {
  const o = DB.obras[rec.obra] || {}; const out = [];
  roles.forEach(r => {
    let m = [];
    if (r === 'cliente') m = splitMails(o.clienteEmail);
    else if (r === 'supervisor' && o.supEmail) m = splitMails(o.supEmail);
    else if (r === 'encarregado' && o.encEmail) m = splitMails(o.encEmail);
    else m = splitMails(DB.team[r] && DB.team[r].email);
    out.push({ role: r, mails: m });
  });
  return out;
}

function handoffModal() {
  saveNow();
  const rec = CUR.rec; const f = FORM[rec.code]; const o = DB.obras[rec.obra] || {};
  const recs = recipientsFor(rec, f.next);
  const to = [...new Set(recs.flatMap(x => x.mails))];
  const missing = recs.filter(x => !x.mails.length).map(x => ROLE_NAME[x.role]);
  const me = whoAmI();
  const subject = `[Stongel Obras] ${f.code} ${f.name}${o.nome ? ' · ' + o.nome : ''}`;
  const auto = ONLINE() && !!SET.session;
  showModal(`<h3>Concluir e passar o bastão</h3>
    <div class="muted" style="margin-bottom:12px">${f.code} · ${esc(f.name)} → ${f.next.map(r => ROLE_NAME[r]).join(', ')}</div>
    ${missing.length ? `<div class="warnbox">Sem e-mail cadastrado para: <b>${missing.join(', ')}</b>. Cadastre na aba Equipe${missing.includes('Cliente da obra') ? ' (o do cliente fica no cadastro da obra)' : ''} ou digite abaixo.</div>` : ''}
    <div class="fields" style="grid-template-columns:1fr">
      <div class="f"><label>Para (separe por vírgula)</label><input id="h_to" value="${esc(to.join(', '))}"></div>
      <div class="f"><label>Cópia</label><input id="h_cc" value="${esc(me.email || '')}"></div>
      <div class="f"><label>Assunto</label><input id="h_sub" value="${esc(subject)}"></div>
      <div class="f"><label>Mensagem</label><textarea id="h_msg" style="min-height:90px">${esc(f.nextMsg + '\n\n' + (me.name ? me.name : ''))}</textarea></div>
    </div>
    <div class="${auto ? 'info' : 'warnbox'}" style="margin-top:12px">${MODE === 'claude'
      ? 'A passagem fica registrada no app (aba <b>Passagens de bastão</b>) para quem recebe. Depois, abra ou copie o e-mail pronto para enviar pelo seu e-mail. O envio automático é feito pela versão independente do app ou depois de conectar o Gmail.'
      : auto ? 'O e-mail será enviado automaticamente, com o formulário completo no corpo, pela conta Google da Stongel. Sem internet, o app abre o e-mail pronto no seu programa de e-mail.' : 'Envio automático não configurado: o app vai abrir o e-mail pronto no seu programa de e-mail. Configure o envio automático em Ajustes.'}</div>
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost" data-act="close">Cancelar</button>
      <button class="btn ghost" data-act="onlyConclude">Só concluir</button>
      <button class="btn blue" data-act="sendHandoff">${auto ? 'Enviar e-mail e concluir' : MODE === 'claude' ? 'Registrar passagem' : 'Abrir e-mail e concluir'}</button></div>`);
}

async function doHandoff(onlyConclude) {
  const rec = CUR.rec; const f = FORM[rec.code]; const me = whoAmI();
  if (onlyConclude) { rec.status = rec.status === 'enviado' ? 'enviado' : 'concluido'; rec.log = rec.log || []; rec.log.push({ at: nowISO(), txt: 'Concluído por ' + (me.name || 'usuário') }); CUR.dirty = true; await saveNow(); closeModal(); render(); toast('Formulário concluído.'); return; }
  const to = splitMails(document.getElementById('h_to').value), cc = splitMails(document.getElementById('h_cc').value);
  const subject = document.getElementById('h_sub').value, msg = document.getElementById('h_msg').value;
  if (!to.length) { toast('Informe pelo menos um e-mail em "Para".'); return; }
  const html = summaryHTML(rec, msg, me);
  const text = msg + '\n\n' + summaryText(rec);
  const h = { id: uid(), at: nowISO(), form: rec.key, code: rec.code, obra: rec.obra, from: me, to, cc, subject, roles: f.next, status: 'pendente', via: '' };
  let sent = false;
  if (ONLINE() && SET.session && navigator.onLine) {
    const btn = document.querySelector('[data-act="sendHandoff"]'); if (btn) { btn.disabled = true; btn.textContent = 'Enviando…'; }
    try {
      const ob = DB.obras[rec.obra] || {};
      const r = await API.send({ to: to.join(','), cc: cc.join(','), subject, html, text, log: { obra: ob.nome || '', cliente: ob.cliente || '', form: rec.code + ' ' + f.name } });
      if (r.ok) { sent = true; h.via = 'automático'; }
      else toast(r.error === 'cota' ? 'Cota diária de e-mails atingida. Abrindo o e-mail…' : 'Não foi possível enviar automaticamente. Abrindo o e-mail…');
    } catch (e) { if (e.code !== 'auth') toast('Não foi possível enviar automaticamente. Abrindo o e-mail…'); }
  }
  if (!sent) { h.via = 'e-mail manual'; }
  rec.status = 'enviado'; rec.log = rec.log || []; rec.log.push({ at: nowISO(), txt: `Bastão passado por ${me.name || 'usuário'} para ${to.join(', ')} (${h.via})` });
  CUR.dirty = true; await saveNow(); await persist('handoffs', h.id, h);
  if (sent) { closeModal(); render(); toast('E-mail enviado e passagem registrada.'); return; }
  // envio manual: e-mail pronto
  const mailto = `mailto:${encodeURIComponent(to.join(','))}?cc=${encodeURIComponent(cc.join(','))}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text.slice(0, 1800))}`;
  showModal(`<h3>Passagem registrada</h3><div class="muted" style="margin-bottom:12px">Agora envie o e-mail para ${esc(to.join(', '))}.</div>
    <div class="row"><a class="btn pri" href="${mailto}" target="_blank" rel="noopener" style="text-decoration:none">Abrir no meu e-mail</a><button class="btn" data-act="copyMail">Copiar texto do e-mail</button></div>
    <div class="note">Se o botão não abrir seu programa de e-mail, use "Copiar texto do e-mail" e cole numa mensagem nova para: ${esc(to.join(', '))}.</div>
    <textarea id="mailtext" style="min-height:160px;margin-top:8px">${esc('Para: ' + to.join(', ') + (cc.length ? '\nCópia: ' + cc.join(', ') : '') + '\nAssunto: ' + subject + '\n\n' + text)}</textarea>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn blue" data-act="closeRender">Pronto</button></div>`);
}

// ================= passagens de bastão =================
function viewPend() {
  const mail = (whoAmI().email || '').toLowerCase();
  const all = Object.values(DB.handoffs).sort((a, b) => (b.at || '').localeCompare(a.at || ''));
  const tab = V.ptab || (mail ? 'mine' : 'all');
  const list = tab === 'mine' ? all.filter(h => (h.to || []).concat(h.cc || []).some(x => x.toLowerCase() === mail)) : all;
  const items = list.map(h => { const o = DB.obras[h.obra] || {}; const f = FORM[h.code] || {};
    return `<div class="card hand" style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><div><b>${h.code} · ${esc(f.name || '')}</b><div class="muted">${esc(o.nome || 'Equipe')}${o.cliente ? ' · ' + esc(o.cliente) : ''}</div></div>
      <span class="chip ${h.status === 'recebido' ? 'sent' : 'draft'}">${h.status === 'recebido' ? 'Recebido' : 'Pendente'}</span></div>
      <div class="muted" style="margin-top:8px">De <b>${esc(h.from && (h.from.name || h.from.email) || '—')}</b> para ${esc((h.to || []).join(', '))} · ${fmtDT(h.at)} · ${esc(h.via || '')}</div>
      <div class="row" style="margin-top:10px"><button class="btn sm pri" data-form="${h.form}">Abrir formulário</button>${h.status !== 'recebido' && !readOnly ? `<button class="btn sm" data-act="recebido" data-id="${h.id}">Marcar como recebido</button>` : ''}</div></div>`; }).join('');
  return `<div class="pagehead"><div style="flex:1"><h2>Passagens de bastão</h2><div class="muted">Cada formulário concluído passa a responsabilidade para a próxima pessoa do processo.</div></div></div>
    ${!mail ? `<div class="warnbox">Informe seu e-mail em Ajustes para ver só as passagens destinadas a você.</div>` : ''}
    <div class="tabs2"><button class="btn sm ${tab === 'mine' ? 'pri' : ''}" data-ptab="mine">Para mim</button><button class="btn sm ${tab === 'all' ? 'pri' : ''}" data-ptab="all">Todas</button></div>
    ${items || `<div class="empty"><img src="${SYM}"><div>Nenhuma passagem de bastão ${tab === 'mine' ? 'para você' : 'registrada'} ainda.</div></div>`}`;
}

// ================= equipe =================
function viewEquipe() {
  const rows = ROLES.map(([k, l]) => { const t = DB.team[k] || {}; return `<tr><td class="ro">${esc(l)}</td><td><input data-team="${k}|nome" value="${esc(t.nome || '')}" placeholder="Nome" ${readOnly ? 'disabled' : ''}></td><td><input data-team="${k}|email" value="${esc(t.email || '')}" placeholder="email@stongel.com.br (vários: separe por vírgula)" ${readOnly ? 'disabled' : ''}></td></tr>`; }).join('');
  const mkey = '_equipe__OB-22'; const has = DB.forms[mkey];
  return `<div class="pagehead"><div style="flex:1"><h2>Equipe e e-mails</h2><div class="muted">Quem recebe cada passagem de bastão. O e-mail do cliente, e se quiser do supervisor e do encarregado de cada obra, ficam no cadastro da obra.</div></div></div>
    <div class="tw"><table><thead><tr><th>Função</th><th>Nome</th><th>E-mail(s)</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${readOnly ? '' : '<div class="row" style="margin-top:12px"><button class="btn pri" data-act="saveTeam">Salvar equipe</button></div>'}
    <div class="sec">Fluxo da passagem de bastão</div>
    <div class="tw"><table><thead><tr><th>Formulário</th><th>Quem preenche</th><th>Passa o bastão para</th></tr></thead><tbody>${FORMS.map(f => `<tr><td><b>${f.code}</b> ${esc(f.name)}</td><td>${ROLE_NAME[f.who]}</td><td>${f.next.map(r => ROLE_NAME[r]).join(', ')}</td></tr>`).join('')}</tbody></table></div>
    <div class="sec">Matriz de habilidades (OB-22)</div>
    <div class="card row" style="justify-content:space-between"><div>Níveis de certificação de cada colaborador por sistema.</div><button class="btn pri" ${has ? `data-form="${mkey}"` : 'data-new="OB-22"'}>${has ? 'Abrir matriz' : 'Criar matriz'}</button></div>`;
}
async function saveTeam() {
  const t = {}; document.querySelectorAll('[data-team]').forEach(el => { const [k, f] = el.dataset.team.split('|'); t[k] = t[k] || {}; t[k][f] = el.value.trim(); });
  for (const [k, v] of Object.entries(t)) { const cur = DB.team[k] || {}; if (cur.nome !== v.nome || cur.email !== v.email) await persist('team', k, v); }
  toast('Equipe salva.');
}

// ================= ajustes =================
function viewAjustes() {
  const online = ONLINE(), logged = online && SET.session;
  const conta = logged ? `<div class="sec">Sua conta</div>
    <div class="card row" style="justify-content:space-between"><div><b>${esc(ME.name)}</b><div class="muted">${esc(ME.email)}${SET.user && SET.user.papel ? ' · ' + esc(SET.user.papel) : ''}</div></div><button class="btn danger" data-act="logout">Sair deste aparelho</button></div>
    <div class="sec">Sincronização</div>
    <div class="info">Os dados ficam na planilha Google da Stongel e são compartilhados com toda a equipe. Este aparelho guarda uma cópia para funcionar sem internet; o que for feito offline é enviado quando a conexão voltar.</div>
    <div class="row"><button class="btn pri" data-act="syncNow">Sincronizar agora</button><button class="btn" data-act="testMail">Enviar e-mail de teste para mim</button></div>
    <div class="note">${OUTBOX.length ? OUTBOX.length + ' alteração(ões) aguardando envio.' : 'Nada pendente.'}${SYNC.at ? ' Última sincronização às ' + SYNC.at.toLocaleTimeString('pt-BR') + '.' : ''}</div>`
    : `<div class="sec">Seus dados</div>
    <div class="fields"><div class="f"><label>Seu nome</label><input id="s_name" value="${esc(SET.myName || '')}"></div><div class="f"><label>Seu e-mail</label><input id="s_mail" value="${esc(SET.myEmail || '')}"></div></div>
    <div class="row" style="margin-top:10px"><button class="btn pri" data-act="saveSet">Salvar</button></div>
    <div class="warnbox" style="margin-top:12px">Modo local: os dados ficam salvos só neste navegador, neste aparelho. Faça backup com frequência.</div>`;
  const backup = `<div class="sec">Backup dos dados</div>
    <div class="row"><button class="btn pri" data-act="export">Baixar backup</button><label class="btn" style="display:inline-block">Restaurar backup<input type="file" accept=".json" id="imp" style="display:none"></label></div>
    ${logged ? '<div class="note">Restaurar um backup envia todos os registros dele para a planilha (substitui os registros de mesmo código).</div>' : ''}`;
  const app = `<div class="sec">Aplicativo</div>
    <div class="row"><button class="btn" data-act="install" id="installBtn" ${deferredInstall ? '' : 'hidden'}>Instalar app neste aparelho</button></div>
    <div class="note">No iPhone: abra no Safari → Compartilhar → "Adicionar à Tela de Início". No Android: menu do Chrome → "Instalar app" ou "Adicionar à tela inicial".</div>`;
  return `<div class="pagehead"><div style="flex:1"><h2>Ajustes</h2></div></div>${conta}${backup}${app}`;
}
function saveSet() {
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : undefined; };
  const before = apiUrl();
  [['s_name', 'myName'], ['s_mail', 'myEmail'], ['s_url', 'scriptUrl']].forEach(([id, k]) => { const v = g(id); if (v !== undefined) SET[k] = v; });
  if (apiUrl() !== before) { SET.session = ''; SET.user = null; lsDel(LSL); }
  lsSet(LSS, SET); applyUser(); toast('Ajustes salvos.'); render();
}
async function testMail() {
  if (!ONLINE() || !SET.session) { toast('Entre com seu e-mail primeiro.'); return; }
  try {
    const r = await API.send({ to: ME.email, subject: '[Stongel Obras] Teste de envio', html: '<p>Envio automático do app de Formulários de Obras Stongel funcionando.</p>', text: 'Envio automático funcionando.' });
    toast(r.ok ? 'E-mail de teste enviado para ' + ME.email + '.' : 'Falhou: ' + (r.detail || r.error), 4000);
  } catch (e) { if (e.code !== 'auth') toast('Não foi possível falar com o servidor.'); }
}

// ================= modal & eventos =================
function showModal(h) { document.getElementById('modal').innerHTML = `<div class="modal"><div class="box">${h}</div></div>`; }
function closeModal() { document.getElementById('modal').innerHTML = ''; }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('Copiado.'); } catch (e) { toast('Selecione o texto e copie manualmente.'); } }

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go],[data-obra],[data-form],[data-new],[data-act],[data-ptab]'); if (!t) return;
  if (t.dataset.go) { if (V.view === 'form') await saveNow(); go(t.dataset.go); return; }
  if (t.dataset.ptab) { V.ptab = t.dataset.ptab; render(); return; }
  if (t.dataset.form) { if (V.view === 'form') await saveNow(); CUR = null; const r = DB.forms[t.dataset.form]; if (r && r.obra !== '_equipe') V.obra = r.obra; V.view = 'form'; V.key = t.dataset.form; editing = false; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.new) { if (readOnly) return; newForm(t.dataset.new); window.scrollTo(0, 0); return; }
  if (t.dataset.obra && !t.dataset.act) { if (V.view === 'form') await saveNow(); go('obra', t.dataset.obra); return; }
  const a = t.dataset.act;
  if (a === 'novaObra') obraModal();
  else if (a === 'editObra') obraModal(DB.obras[V.obra]);
  else if (a === 'saveObra') saveObra(t.dataset.id);
  else if (a === 'arquivar') { const o = DB.obras[V.obra]; if (o) { o.arquivada = true; closeModal(); await persist('obras', o.id, o); go('obras'); toast('Obra arquivada.'); } }
  else if (a === 'close') closeModal();
  else if (a === 'closeRender') { closeModal(); render(); }
  else if (a === 'addRow') { const x = FORM[CUR.rec.code].fields.find(z => z.id === t.dataset.t); const rows = tableRows(x, CUR.rec.data); rows.push({}); CUR.rec.data[x.id] = rows; scheduleSave(); editing = false; render(); }
  else if (a === 'handoff') handoffModal();
  else if (a === 'sendHandoff') doHandoff(false);
  else if (a === 'onlyConclude') doHandoff(true);
  else if (a === 'copyForm') copy(`${CUR.rec.code} ${FORM[CUR.rec.code].name}\n${(DB.obras[CUR.rec.obra] || {}).nome || ''}\n` + summaryText(CUR.rec));
  else if (a === 'copyMail') copy(document.getElementById('mailtext').value);
  else if (a === 'print') window.print();
  else if (a === 'delForm') { showModal(`<h3>Excluir formulário?</h3><p>Os dados deste formulário serão apagados.</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn danger" data-act="delYes">Excluir</button></div>`); }
  else if (a === 'delYes') { const k = CUR.key, ob = CUR.rec.obra; closeModal(); CUR = null; await persist('forms', k, null); ob === '_equipe' ? go('equipe') : go('obra', ob); toast('Formulário excluído.'); }
  else if (a === 'recebido') { const h = DB.handoffs[t.dataset.id]; if (h) { h.status = 'recebido'; h.recebidoEm = nowISO(); await persist('handoffs', h.id, h); render(); } }
  else if (a === 'saveTeam') saveTeam();
  else if (a === 'saveSet') saveSet();
  else if (a === 'testMail') testMail();
  else if (a === 'syncNow') { await flush(); await pull(); render(); toast(OUTBOX.length ? 'Ainda há alterações pendentes.' : 'Sincronizado.'); }
  else if (a === 'logout') logoutModal();
  else if (a === 'logoutYes') logout();
  else if (a === 'install') { if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; t.hidden = true; } }
  else if (a === 'export') { const blob = new Blob([JSON.stringify(DB, null, 1)], { type: 'application/json' }); const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = 'backup-stongel-obras-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(l); l.click(); l.remove(); }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { V.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById('q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } } });
document.addEventListener('change', e => {
  if (e.target.id === 'imp' && e.target.files[0]) { const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); KINDS.forEach(k => DB[k] = d[k] || {}); lsSet(LS, DB); if (ONLINE() && SET.session) { KINDS.forEach(k => Object.entries(DB[k]).forEach(([id, v]) => enqueue(k, id, v))); flush(); } toast('Backup restaurado.'); go('obras'); } catch (x) { toast('Arquivo de backup inválido.'); } }; r.readAsText(e.target.files[0]); }
});
window.addEventListener('beforeunload', () => { if (CUR && CUR.dirty) saveNow(); });
boot();
</script>
